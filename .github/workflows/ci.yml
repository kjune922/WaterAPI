name: Verify WaterAPI
on:
  push:
    branches: [main, "portfolio/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mysql-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: waterapi_verification
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdisposable-ci-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      WATERAPI_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/waterapi_verification?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul
      WATERAPI_TEST_DB_USERNAME: root
      WATERAPI_TEST_DB_PASSWORD: disposable-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew --no-daemon mysqlTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-test-report
          path: |
            build/reports/tests/mysqlTest
            build/test-results/mysqlTest
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew --no-daemon clean test bootJar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: build/reports/tests/test
  mysql-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure disposable database
        run: |
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "WATERAPI_DB_PASSWORD=$(openssl rand -hex 24)" >> .env
      - run: docker compose up --build -d
      - name: Verify Flyway, JPA validation and application health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 3
          done
          exit 1
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down -v
        if: always()
