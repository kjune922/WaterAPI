spring.datasource.url=${WATERAPI_DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${WATERAPI_DB_USERNAME}
spring.datasource.password=${WATERAPI_DB_PASSWORD}
# Local integration only. Production migrations will be added separately.
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
