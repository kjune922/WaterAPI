spring.application.name=WaterAPI

## 로컬 H2 파일 데이터베이스
#spring.datasource.url=jdbc:h2:file:./data/waterdb
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#
## H2 Console
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# 이제 MYSQL을 로컬에서 실행
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# DB Source URL
spring.datasource.url=jdbc:mysql://localhost:3306/waterapi
# DB username
spring.datasource.username=waterapi
# DB password
spring.profiles.include=secret,stub
# 처리시 발생하는 SQL을 보여줄지?
spring.jpa.show-sql=true
# 프로젝트 실행 시 자동으로 DDL(create, alter, drop) 을 생성할 것인지 결정
spring.jpa.hibernate.ddl-auto=update
# 실제 JPA 구현체인 hibernate가 동작하면서 발생하는 SQL을 포멧팅해서 출력
spring.jpa.properties.hibernate.format_sql=true

# OpenAI
openai.api-key=${OPENAI_API_KEY:}
openai.model=gpt-4o-mini