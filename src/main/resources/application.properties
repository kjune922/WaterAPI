spring.application.name=WaterAPI
spring.profiles.default=stub

# Default local demo: no external database or API key required.
spring.datasource.url=jdbc:h2:file:./data/waterdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Migrations are enabled explicitly for the MySQL deployment profile.
spring.flyway.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
