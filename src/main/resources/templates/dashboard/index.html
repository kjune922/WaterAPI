<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>대시보드 · WaterAPI</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header('dashboard')}"></header>
<main id="main">
<div class="page-heading">
    <div><h1>대시보드</h1><p>상하수도 시설 점검 및 AI 분석 현황</p></div>
    <a class="primary" th:href="@{/inspections/new}">＋ 점검일지 등록</a>
</div>
<div class="metrics">
    <a class="metric" th:href="@{/facilities}">
        <div class="metric-label"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 20V8l6 3V7l6 3V4h4l2 16H3Z"/><path d="M7 16h2m3 0h2"/></svg>등록 시설</div>
        <strong th:text="${summary.facilityCount}"></strong><span class="metric-arrow" aria-hidden="true">↗</span>
    </a>
    <a class="metric" th:href="@{/inspections}">
        <div class="metric-label"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6m-6 4h6"/></svg>전체 점검일지</div>
        <strong th:text="${summary.inspectionCount}"></strong><span class="metric-arrow" aria-hidden="true">↗</span>
    </a>
    <a class="metric" th:href="@{/analyses}">
        <div class="metric-label"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></svg>AI 분석 결과</div>
        <strong th:text="${summary.analysisCount}"></strong><span class="metric-arrow" aria-hidden="true">↗</span>
    </a>
    <a class="metric" th:href="@{/analyses(reviewStatus=PENDING_REVIEW)}">
        <div class="metric-label">사용자 검토 대기</div>
        <strong th:text="${summary.reviewPendingCount}"></strong><span class="metric-arrow" aria-hidden="true">↗</span>
    </a>
</div>
<div class="two-cols">
    <section class="panel overview">
        <h2>점검 처리 상태</h2>
        <ul class="counts">
            <li><a th:href="@{/inspections(processingStatus=PENDING)}">
                <span class="badge PENDING">대기</span>
                <strong th:text="${summary.pendingCount}"></strong><span aria-hidden="true">›</span>
            </a></li>
            <li><a th:href="@{/inspections(processingStatus=IN_PROGRESS)}">
                <span class="badge IN_PROGRESS">처리 중</span>
                <strong th:text="${summary.inProgressCount}"></strong><span aria-hidden="true">›</span>
            </a></li>
            <li><a th:href="@{/inspections(processingStatus=COMPLETED)}">
                <span class="badge COMPLETED">처리 완료</span>
                <strong th:text="${summary.completedCount}"></strong><span aria-hidden="true">›</span>
            </a></li>
        </ul>
    </section>
    <section class="panel overview">
        <h2>확정 결과 현황</h2>
        <span th:replace="~{fragments/header :: stubMode}"></span>
        <ul class="counts">
            <li><a th:href="@{/analyses(reviewStatus=CONFIRMED,riskLevel=NORMAL)}">
                <span class="badge NORMAL">정상</span>
                <strong th:text="${summary.normalCount}"></strong><span aria-hidden="true">›</span>
            </a></li>
            <li><a th:href="@{/analyses(reviewStatus=CONFIRMED,riskLevel=CAUTION)}">
                <span class="badge CAUTION">주의</span>
                <strong th:text="${summary.cautionCount}"></strong><span aria-hidden="true">›</span>
            </a></li>
            <li><a th:href="@{/analyses(reviewStatus=CONFIRMED,riskLevel=WARNING)}">
                <span class="badge WARNING">위험</span>
                <strong th:text="${summary.warningCount}"></strong><span aria-hidden="true">›</span>
            </a></li>
        </ul>
    </section>
</div>
</main>
</body>
</html>
