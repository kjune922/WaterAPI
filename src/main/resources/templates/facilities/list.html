<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>상하수도 시설 목록 · WaterAPI</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header('facilities')}"></header>
<main id="main">
<div class="page-heading"><h1>상하수도 시설 목록</h1><a class="primary" th:href="@{/facilities/new}">＋ 새 시설 등록</a></div>

<div class="table-scroll" tabindex="0" role="region" aria-label="상하수도 시설 목록 표">
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>시설 이름</th>
        <th>시설 유형</th>
        <th>시설 위치</th>
        <th>관리</th>
    </tr>
    </thead>

    <tbody>
    <tr th:if="${#lists.isEmpty(facilities)}">
        <td colspan="5">
            등록된 시설이 없습니다.
        </td>
    </tr>

    <tr th:each="facility : ${facilities}">
        <td th:text="${facility.id}"></td>

        <td th:text="${facility.name}"></td>

        <td th:text="${facility.facilityType}"></td>

        <td th:text="${facility.location}"></td>

        <td>
            <a th:href="@{/facilities/{id}/edit(id=${facility.id})}">
                수정
            </a>

            <form th:action="@{/facilities/{id}/delete(id=${facility.id})}"
                  method="post"
                  class="inline"
                  onsubmit="return confirm('시설을 삭제하시겠습니까?');">

                <button type="submit">
                    삭제
                </button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</div>
</main>
</body>
</html>
