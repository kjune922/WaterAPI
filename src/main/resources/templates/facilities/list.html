<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>시설 목록</title>
</head>
<body>
<h1>상하수도 시설 목록</h1>

<a th:href="@{/facilities/new}">새 시설 등록</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>시설 이름</th>
        <th>시설 유형</th>
        <th>시설 위치</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="facility : ${facilities}">
        <td th:text="${facility.id}"></td>
        <td th:text="${facility.name}"></td>
        <td th:text="${facility.facilityType}"></td>
        <td th:text="${facility.location}"></td>
    </tr>

    <tr th:if="${#lists.isEmpty(facilities)}">
        <td colspan="4">등록된 시설이 없습니다.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
