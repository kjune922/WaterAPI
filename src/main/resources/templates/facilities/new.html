<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>상하수도 시설 등록 · WaterAPI</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header('facilities')}"></header>
<main id="main">
<h1>상하수도 시설 등록</h1>

<form class="panel edit-form" th:action="@{/facilities}"
      th:object="${facilityForm}"
      method="post">

    <div>
        <label for="name">시설 이름</label>
        <input id="name" type="text" th:field="*{name}">
        <p class="field-error" th:errors="*{name}"></p>
    </div>

    <div>
        <label for="facilityType">시설 유형</label>
        <select id="facilityType" th:field="*{facilityType}">
            <option value="">시설 유형 선택</option>
            <option th:each="type : ${facilityTypes}"
                    th:value="${type}"
                    th:text="${type}">
            </option>
        </select>
        <p class="field-error" th:errors="*{facilityType}"></p>
    </div>

    <div>
        <label for="location">시설 위치</label>
        <input id="location" type="text" th:field="*{location}">
        <p class="field-error" th:errors="*{location}"></p>
    </div>

    <button type="submit">등록</button>
    <a th:href="@{/facilities}">등록 취소</a>
</form>
</main>
</body>
</html>
