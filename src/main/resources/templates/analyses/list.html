<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 분석 결과 목록 · WaterAPI</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header('analyses')}"></header>
<main id="main">
<div class="page-heading"><h1>AI 분석 결과 목록</h1><span th:replace="~{fragments/header :: stubMode}"></span></div>
<form class="filters" th:action="@{/analyses}" method="get">
    <label for="riskLevel">표시 위험도</label>
    <select name="riskLevel" id="riskLevel">
        <option value="">전체</option>
        <option th:each="level : ${riskLevels}" th:value="${level}" th:text="${level.description}"
                th:selected="${level == selectedRiskLevel}"></option>
    </select>
    <label for="reviewStatus">검토 상태</label>
    <select name="reviewStatus" id="reviewStatus">
        <option value="">전체</option>
        <option th:each="status : ${reviewStatuses}" th:value="${status}" th:text="${status.description}"
                th:selected="${status == selectedStatus}"></option>
    </select>
    <input type="hidden" name="size" th:value="${analyses.size}">
    <button type="submit">조회</button>
</form>

<p>전체 <strong th:text="${analyses.totalElements}"></strong>건</p>
<div class="table-scroll" tabindex="0" role="region" aria-label="AI 분석 결과 목록 표">
<table>
    <thead>
    <tr>
        <th>분석 ID</th>
        <th>시설 이름</th>
        <th>점검 내용</th>
        <th>AI 요약</th>
        <th>AI 이상 유형</th>
        <th>표시 위험도</th>
        <th>검토 상태</th>
        <th>AI 권장 조치</th>
        <th>분석 시각</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="analysis : ${analyses.content}">
        <td th:text="${analysis.id}"></td>

        <td th:text="${analysis.inspectionReport.facility.name}">
        </td>

        <td>
            <a th:href="@{/inspections/{id}(id=${analysis.inspectionReport.id})}"
               th:text="${analysis.inspectionReport.listDescription}">
            </a>
        </td>

        <td th:text="${analysis.summary}"></td>

        <td th:text="${analysis.abnormalityType}"></td>

        <td><span class="badge" th:classappend="${analysis.displayRisk}" th:text="${analysis.displayRisk.description}"></span>
            <span th:text="${analysis.reviewStatus.name() == 'CONFIRMED' ? '사용자 확정' : 'AI 제안'}"></span></td>
        <td><span class="badge" th:classappend="${analysis.reviewStatus}" th:text="${analysis.reviewStatus.description}"></span></td>

        <td th:text="${analysis.recommendedAction}"></td>

        <td th:text="${#temporals.format(analysis.analyzedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
    </tr>

    <tr th:if="${analyses.empty}">
        <td colspan="9">
            조회된 AI 분석 결과가 없습니다.
        </td>
    </tr>
    </tbody>
</table>
</div>

<nav class="pager" aria-label="페이지" th:if="${analyses.totalPages > 0}">
    <a th:if="${analyses.hasPrevious()}"
       th:href="@{/analyses(
            page=${analyses.number - 1},
            size=${analyses.size},
            riskLevel=${selectedRiskLevel}, reviewStatus=${selectedStatus}
       )}">
        이전
    </a>

    <span th:each="pageNumber :
            ${#numbers.sequence(0, analyses.totalPages - 1)}">

        <strong th:if="${pageNumber == analyses.number}"
                th:text="${pageNumber + 1}">
        </strong>

        <a th:if="${pageNumber != analyses.number}"
           th:href="@{/analyses(
                page=${pageNumber},
                size=${analyses.size},
                riskLevel=${selectedRiskLevel}, reviewStatus=${selectedStatus}
           )}"
           th:text="${pageNumber + 1}">
        </a>
    </span>

    <a th:if="${analyses.hasNext()}"
       th:href="@{/analyses(
            page=${analyses.number + 1},
            size=${analyses.size},
            riskLevel=${selectedRiskLevel}, reviewStatus=${selectedStatus}
       )}">
        다음
    </a>
</nav>

<a th:href="@{/inspections}">
    점검일지 목록으로
</a>
</main>
</body>
</html>
