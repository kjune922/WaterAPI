<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI 분석 결과 목록</title>
</head>
<body>

<h1>AI 분석 결과 목록</h1>

<div>
    <a th:href="@{/analyses}">
        전체
    </a>

    <span th:each="riskLevel : ${riskLevels}">
        <a th:href="@{/analyses(riskLevel=${riskLevel})}"
           th:text="${riskLevel.description}">
        </a>
    </span>
</div>

<br>

<table border="1">
    <thead>
    <tr>
        <th>분석 ID</th>
        <th>시설 이름</th>
        <th>점검 내용</th>
        <th>요약</th>
        <th>이상 유형</th>
        <th>위험도</th>
        <th>권장 조치</th>
        <th>분석 시각</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="analysis : ${analyses}">
        <td th:text="${analysis.id}"></td>

        <td th:text="${analysis.inspectionReport.facility.name}">
        </td>

        <td>
            <a th:href="@{/inspections/{id}(
                    id=${analysis.inspectionReport.id}
               )}"
               th:text="${analysis.inspectionReport.content}">
            </a>
        </td>

        <td th:text="${analysis.summary}"></td>

        <td th:text="${analysis.abnormalityType}"></td>

        <td th:text="${analysis.riskLevel.description}"></td>

        <td th:text="${analysis.recommendedAction}"></td>

        <td th:text="${analysis.analyzedAt}"></td>
    </tr>

    <tr th:if="${#lists.isEmpty(analyses)}">
        <td colspan="8">
            조회된 AI 분석 결과가 없습니다.
        </td>
    </tr>
    </tbody>
</table>

<br>

<a th:href="@{/inspections}">
    점검일지 목록으로
</a>

</body>
</html>
