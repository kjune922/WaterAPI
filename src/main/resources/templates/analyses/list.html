<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI 분석 결과 목록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h1>AI 분석 결과 목록</h1>

<a th:href="@{/}">대시보드</a>

<div>
    <a th:href="@{/analyses}">
        전체
    </a>

    <span th:each="riskLevel : ${riskLevels}">
        <a th:href="@{/analyses(riskLevel=${riskLevel})}"
           th:text="${riskLevel.description}">
        </a>
    </span>
</div>

<br>

<table border="1">
    <thead>
    <tr>
        <th>분석 ID</th>
        <th>시설 이름</th>
        <th>점검 내용</th>
        <th>요약</th>
        <th>이상 유형</th>
        <th>위험도</th>
        <th>권장 조치</th>
        <th>분석 시각</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="analysis : ${analyses.content}">
        <td th:text="${analysis.id}"></td>

        <td th:text="${analysis.inspectionReport.facility.name}">
        </td>

        <td>
            <a th:href="@{/inspections/{id}(id=${analysis.inspectionReport.id})}"
               th:text="${analysis.inspectionReport.content}">
            </a>
        </td>

        <td th:text="${analysis.summary}"></td>

        <td th:text="${analysis.abnormalityType}"></td>

        <td th:text="${analysis.riskLevel.description}"></td>

        <td th:text="${analysis.recommendedAction}"></td>

        <td th:text="${analysis.analyzedAt}"></td>
    </tr>

    <tr th:if="${analyses.empty}">
        <td colspan="8">
            조회된 AI 분석 결과가 없습니다.
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${analyses.totalPages > 0}">
    <a th:if="${analyses.hasPrevious()}"
       th:href="@{/analyses(
            page=${analyses.number - 1},
            size=${analyses.size},
            riskLevel=${selectedRiskLevel}
       )}">
        이전
    </a>

    <span th:each="pageNumber :
            ${#numbers.sequence(0, analyses.totalPages - 1)}">

        <strong th:if="${pageNumber == analyses.number}"
                th:text="${pageNumber + 1}">
        </strong>

        <a th:if="${pageNumber != analyses.number}"
           th:href="@{/analyses(
                page=${pageNumber},
                size=${analyses.size},
                riskLevel=${selectedRiskLevel}
           )}"
           th:text="${pageNumber + 1}">
        </a>
    </span>

    <a th:if="${analyses.hasNext()}"
       th:href="@{/analyses(
            page=${analyses.number + 1},
            size=${analyses.size},
            riskLevel=${selectedRiskLevel}
       )}">
        다음
    </a>
</div>

<br>

<a th:href="@{/inspections}">
    점검일지 목록으로
</a>

</body>
</html>
