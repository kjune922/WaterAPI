<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>점검일지 목록 · WaterAPI</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header('inspections')}"></header>
<main id="main">
<div class="page-heading"><h1>점검일지 목록</h1><a class="primary" th:href="@{/inspections/new}">＋ 점검일지 등록</a></div>
<form class="filters" th:action="@{/inspections}" method="get">
    <label for="processing-filter">처리 상태 필터</label>
    <select id="processing-filter" name="processingStatus">
        <option value="">전체</option>

        <option th:each="status : ${processingStatuses}"
                th:value="${status}"
                th:text="${status.description}"
                th:selected="${status == selectedProcessingStatus}">
        </option>
    </select>

    <button type="submit">조회</button>
</form>
<div class="table-scroll" tabindex="0" role="region" aria-label="점검일지 목록 표">
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>시설 이름</th>
        <th>점검 일자</th>
        <th>처리 상태</th>
        <th>점검 내용</th>
        <th>상세</th>
    </tr>
    </thead>

    <tbody>
    <tr th:if="${inspections.isEmpty()}">
        <td colspan="6">
            조회된 점검일지가 없습니다.
        </td>
    </tr>

    <tr th:each="inspection : ${inspections.content}">
        <td th:text="${inspection.id}"></td>

        <td th:text="${inspection.facility.name}"></td>

        <td th:text="${inspection.inspectionDate}"></td>

        <td><span class="badge" th:classappend="${inspection.processingStatus}" th:text="${inspection.processingStatus.description}"></span></td>

        <td th:text="${inspection.listDescription}"></td>

        <td>
            <a th:href="@{/inspections/{id}(id=${inspection.id})}">
                상세 보기
            </a>
        </td>
    </tr>
    </tbody>
</table>
</div>

<nav class="pager" aria-label="페이지" th:if="${inspections.totalPages > 0}">
    <a th:if="${inspections.hasPrevious()}"
       th:href="@{/inspections(
            page=${inspections.number - 1},
            size=${inspections.size},
            processingStatus=${selectedProcessingStatus}
       )}">
        이전
    </a>

    <span th:each="pageNumber :
            ${#numbers.sequence(0, inspections.totalPages - 1)}">

        <strong th:if="${pageNumber == inspections.number}"
                th:text="${pageNumber + 1}">
        </strong>

        <a th:unless="${pageNumber == inspections.number}"
           th:href="@{/inspections(
                page=${pageNumber},
                size=${inspections.size},
                processingStatus=${selectedProcessingStatus}
           )}"
           th:text="${pageNumber + 1}">
        </a>
    </span>

    <a th:if="${inspections.hasNext()}"
       th:href="@{/inspections(
            page=${inspections.number + 1},
            size=${inspections.size},
            processingStatus=${selectedProcessingStatus}
       )}">
        다음
    </a>
</nav>

<p th:if="${inspections.totalPages > 0}">
    현재 페이지:
    <span th:text="${inspections.number + 1}"></span>
    /
    <span th:text="${inspections.totalPages}"></span>
</p>
</main>
</body>
</html>
