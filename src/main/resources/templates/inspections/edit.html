<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>점검일지 수정</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h1>점검일지 수정</h1>

<p>
    점검일지를 수정하면 기존 AI 분석 결과가 삭제됩니다.
    수정 완료 후 다시 AI 분석을 실행해주세요.
</p>

<form th:action="@{/inspections/{id}/edit(id=${inspectionId})}"
      th:object="${inspectionForm}"
      method="post">

    <div>
        <label for="content">점검 내용</label>

        <textarea id="content"
                  th:field="*{content}"
                  rows="10"
                  cols="60">
        </textarea>

        <div th:errors="*{content}">
            점검 내용 오류
        </div>
    </div>

    <br>

    <div>
        <label for="inspectionDate">점검 일자</label>

        <input id="inspectionDate"
               type="date"
               th:field="*{inspectionDate}">

        <div th:errors="*{inspectionDate}">
            점검 일자 오류
        </div>
    </div>

    <br>

    <button type="submit">수정 완료</button>
</form>

<br>

<a th:href="@{/inspections/{id}(id=${inspectionId})}">
    수정 취소
</a>

</body>
</html>
