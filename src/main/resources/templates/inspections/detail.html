<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>점검일지 상세</title>
</head>
<body>

<h1>점검일지 상세</h1>

<table border="1">
    <tbody>
    <tr>
        <th>점검일지 ID</th>
        <td th:text="${inspection.id}"></td>
    </tr>

    <tr>
        <th>시설 이름</th>
        <td th:text="${inspection.facility.name}"></td>
    </tr>

    <tr>
        <th>시설 유형</th>
        <td th:text="${inspection.facility.facilityType}"></td>
    </tr>

    <tr>
        <th>시설 위치</th>
        <td th:text="${inspection.facility.location}"></td>
    </tr>

    <tr>
        <th>점검 일자</th>
        <td th:text="${inspection.inspectionDate}"></td>
    </tr>

    <tr>
        <th>처리 상태</th>
        <td th:text="${inspection.processingStatus.description}"></td>
    </tr>

    <tr>
        <th>점검 내용</th>
        <td th:text="${inspection.content}"></td>
    </tr>
    </tbody>
</table>

<hr>

<h2>처리 상태 변경</h2>

<form th:action="@{/inspections/{id}/status(id=${inspection.id})}"
      method="post">

    <select name="processingStatus">
        <option th:each="status : ${T(com.kjune922.waterapi.inspection.ProcessingStatus).values()}"
                th:value="${status}"
                th:text="${status.description}"
                th:selected="${status == inspection.processingStatus}">
        </option>
    </select>

    <button type="submit">상태 변경</button>
</form>

<hr>

<h2>AI 분석 결과</h2>

<div th:if="${analysis == null}">
    <p>아직 AI 분석을 실행하지 않았습니다.</p>

    <form th:action="@{/inspections/{id}/analysis(id=${inspection.id})}"
          method="post">
        <button type="submit">AI 분석 실행</button>
    </form>
</div>

<div th:if="${analysis != null}">
    <table border="1">
        <tbody>
        <tr>
            <th>요약</th>
            <td th:text="${analysis.summary}"></td>
        </tr>

        <tr>
            <th>이상 유형</th>
            <td th:text="${analysis.abnormalityType}"></td>
        </tr>

        <tr>
            <th>위험도</th>
            <td th:text="${analysis.riskLevel}"></td>
        </tr>

        <tr>
            <th>권장 조치</th>
            <td th:text="${analysis.recommendedAction}"></td>
        </tr>

        <tr>
            <th>분석 시각</th>
            <td th:text="${analysis.analyzedAt}"></td>
        </tr>
        </tbody>
    </table>
</div>

<br>

<a th:href="@{/inspections}">목록으로</a>

</body>
</html>
