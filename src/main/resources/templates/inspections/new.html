<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>점검일지 등록 · WaterAPI</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header('inspections')}"></header>
<main id="main">
<h1>점검 시설 선택</h1>
<div class="panel">
    <p th:if="${facilities.empty}">등록된 시설이 없습니다. <a th:href="@{/facilities/new}">시설 등록</a></p>
    <ul class="counts">
        <li th:each="facility : ${facilities}">
            <a th:href="@{/inspections/new/{id}(id=${facility.id})}">
                <span th:text="${facility.name}"></span><span th:text="${facility.facilityType}"></span>
            </a>
        </li>
    </ul>
</div>
</main>
</body>
</html>
