<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>요청 처리 오류 · WaterAPI</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header('')}"></header>
<main id="main">
<div class="panel error-box">
    <p class="status" th:text="${status}">500</p>

    <h1 th:text="${error}">Error</h1>

    <p class="message" th:text="${message}">
        요청을 처리하지 못했습니다.
    </p>

    <div class="details">
        <p>
            요청 경로:
            <span th:text="${path}"></span>
        </p>

        <p>
            발생 시각:
            <span th:text="${#temporals.format(timestamp, 'yyyy-MM-dd HH:mm:ss')}"></span>
        </p>
    </div>

    <nav class="menu">
        <a th:href="@{/}">대시보드</a>
        <a th:href="@{/inspections}">점검일지 목록</a>
    </nav>
</div>
</main>
</body>
</html>
