<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>요청 처리 오류</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
            max-width: 700px;
            margin: 80px auto;
            padding: 0 20px;
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            color: #222;
        }

        .error-box {
            padding: 32px;
            background-color: white;
            border: 1px solid #ddd;
            border-left: 6px solid #dc2626;
            border-radius: 10px;
        }

        .status {
            margin: 0;
            color: #dc2626;
            font-size: 44px;
        }

        .message {
            margin: 24px 0;
            font-size: 18px;
        }

        .details {
            color: #666;
            font-size: 14px;
        }

        .menu {
            display: flex;
            gap: 10px;
            margin-top: 28px;
        }

        .menu a {
            padding: 10px 16px;
            color: white;
            background-color: #2563eb;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="error-box">
    <p class="status" th:text="${status}">500</p>

    <h1 th:text="${error}">Error</h1>

    <p class="message" th:text="${message}">
        요청을 처리하지 못했습니다.
    </p>

    <div class="details">
        <p>
            요청 경로:
            <span th:text="${path}"></span>
        </p>

        <p>
            발생 시각:
            <span th:text="${timestamp}"></span>
        </p>
    </div>

    <nav class="menu">
        <a th:href="@{/}">대시보드</a>
        <a th:href="@{/inspections}">점검일지 목록</a>
    </nav>
</div>

</body>
</html>
